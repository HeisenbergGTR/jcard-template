<div id="output">
  <div class="card-toolbar">
    <div class="side-toggle" role="group" aria-label="Card side">
      <button type="button" data-side="outside" aria-pressed="true">Outside</button>
      <button type="button" data-side="inside" aria-pressed="false">Inside</button>
    </div>
    <label class="safe-toggle"><input id="input-safe-guide" type="checkbox" checked /> Safe area</label>
    <span class="safe-warning" id="safe-warning" aria-live="polite"></span>
  </div>
  <div id="jcard">
    <div class="template printable template-outside">
      <div class="template-boundaries">
        <div class="template-bleed printable-bleed"></div>
        <div class="template-crop printable-crop"></div>
      </div>
      <div class="template-fold-1 printable-fold"></div>
      <div class="template-fold-2 printable-fold"></div>
      <div class="template-art template-art-wrap template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-art template-art-back template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-art template-art-spine template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-back">
        <div class="template-side-a-label template-foreground"></div>
        <div class="template-side-a-contents template-foreground"></div>
        <div class="template-side-b-label template-foreground"></div>
        <div class="template-side-b-contents template-foreground"></div>
      </div>
      <div class="template-spine">
        <div class="template-spine-title-group">
          <div class="template-spine-title-upper template-foreground"></div>
          <div class="template-spine-title-lower template-foreground"></div>
        </div>
        <div class="template-note-group">
          <div class="template-note-upper template-foreground"></div>
          <div class="template-note-lower template-foreground"></div>
        </div>
      </div>
      <div class="template-front">
        <div class="template-cover-frame template-foreground" title="Drag to move, scroll to zoom">
          <img class="template-cover" src="" alt="Cover Image" draggable="false" />
        </div>
        <div class="template-front-group">
          <div class="template-front-title-group">
            <div class="template-front-title-upper template-foreground"></div>
            <div class="template-front-title-lower template-foreground"></div>
          </div>
          <div class="template-contents template-foreground"></div>
          <div class="template-footer template-foreground"></div>
        </div>
      </div>
      <div class="template-safe screen-only">
        <div class="template-safe-back"></div>
        <div class="template-safe-spine"></div>
        <div class="template-safe-front"></div>
      </div>
    </div>
    <div class="template printable template-inside mirrored side-hidden">
      <div class="template-boundaries">
        <div class="template-bleed printable-bleed"></div>
        <div class="template-crop printable-crop"></div>
      </div>
      <div class="template-fold-1 printable-fold"></div>
      <div class="template-fold-2 printable-fold"></div>
      <div class="template-art template-art-inside-wrap template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-art template-art-inside-back template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-art template-art-inside-spine template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-art template-art-inside-front template-foreground">
        <img class="template-art-image" src="" alt="" draggable="false" />
      </div>
      <div class="template-back">
        <div class="template-inside-back-text template-foreground"></div>
      </div>
      <div class="template-spine">
        <div class="template-inside-spine-text template-foreground"></div>
      </div>
      <div class="template-front">
        <div class="template-inside-front-text template-foreground"></div>
      </div>
      <div class="template-safe screen-only">
        <div class="template-safe-back"></div>
        <div class="template-safe-spine"></div>
        <div class="template-safe-front"></div>
      </div>
    </div>
  </div>
</div>
