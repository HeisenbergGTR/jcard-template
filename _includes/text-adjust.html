{%-comment-%}
Fine adjustment fields for one text block. Parameters: `id` (kebab-case block
id, matching the entries in application-model.mjs) and `title`.
{%-endcomment-%}
<details class="text-adjust">
<summary><h4>{{include.title}}: Fine Adjust</h4></summary>
<div class="field row" id="field-{{include.id}}-offset-x">
  <label for="input-{{include.id}}-offset-x">Move → (pt):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-offset-x" min="-36" max="36" step="0.1" aria-label="Move along" />
    <input id="input-{{include.id}}-offset-x" type="number" min="-288" max="288" step="0.1" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-offset-y">
  <label for="input-{{include.id}}-offset-y">Move ↓ (pt):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-offset-y" min="-36" max="36" step="0.1" aria-label="Move across" />
    <input id="input-{{include.id}}-offset-y" type="number" min="-288" max="288" step="0.1" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-letter-spacing">
  <label for="input-{{include.id}}-letter-spacing">Letter spacing (pt):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-letter-spacing" min="-2" max="10" step="0.05" aria-label="Letter spacing" />
    <input id="input-{{include.id}}-letter-spacing" type="number" min="-20" max="100" step="0.05" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-line-height">
  <label for="input-{{include.id}}-line-height">Line height (×):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-line-height" min="0.5" max="3" step="0.01" aria-label="Line height" />
    <input id="input-{{include.id}}-line-height" type="number" min="0.1" max="10" step="0.01" />
  </div>
</div>
<p><i>Directions follow the text, so on the spine and back "→" runs along the
lines.</i></p>
</details>
