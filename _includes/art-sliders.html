{%-comment-%}
Slider fields for an image. Parameters: `id` (kebab-case prefix), and flags
`zoom` (adds zoom and move) and `opacity`. Filters are always included.
{%-endcomment-%}
{%-if include.zoom%}
<div class="field row" id="field-{{include.id}}-zoom">
  <label for="input-{{include.id}}-zoom">Zoom (×):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-zoom" min="0.1" max="5" step="0.01" aria-label="Zoom" />
    <input id="input-{{include.id}}-zoom" type="number" min="0.01" max="20" step="0.01" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-offset-x">
  <label for="input-{{include.id}}-offset-x">Move X (%):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-offset-x" min="-100" max="100" step="0.1" aria-label="Move X" />
    <input id="input-{{include.id}}-offset-x" type="number" min="-500" max="500" step="0.1" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-offset-y">
  <label for="input-{{include.id}}-offset-y">Move Y (%):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-offset-y" min="-100" max="100" step="0.1" aria-label="Move Y" />
    <input id="input-{{include.id}}-offset-y" type="number" min="-500" max="500" step="0.1" />
  </div>
</div>
{%-endif-%}
{%-if include.opacity%}
<div class="field row" id="field-{{include.id}}-opacity">
  <label for="input-{{include.id}}-opacity">Opacity:</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-opacity" min="0" max="1" step="0.01" aria-label="Opacity" />
    <input id="input-{{include.id}}-opacity" type="number" min="0" max="1" step="0.01" />
  </div>
</div>
{%-endif%}
<div class="field row" id="field-{{include.id}}-brightness">
  <label for="input-{{include.id}}-brightness">Brightness (×):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-brightness" min="0" max="2" step="0.01" aria-label="Brightness" />
    <input id="input-{{include.id}}-brightness" type="number" min="0" max="5" step="0.01" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-contrast">
  <label for="input-{{include.id}}-contrast">Contrast (×):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-contrast" min="0" max="2" step="0.01" aria-label="Contrast" />
    <input id="input-{{include.id}}-contrast" type="number" min="0" max="5" step="0.01" />
  </div>
</div>
<div class="field row" id="field-{{include.id}}-saturate">
  <label for="input-{{include.id}}-saturate">Saturation (×):</label>
  <div class="input fluid slider">
    <input type="range" data-for="input-{{include.id}}-saturate" min="0" max="2" step="0.01" aria-label="Saturation" />
    <input id="input-{{include.id}}-saturate" type="number" min="0" max="5" step="0.01" />
  </div>
</div>
